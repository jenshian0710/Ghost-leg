<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式鬼腳圖 (阿彌陀籤) 遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 Excel 與 Word 前端解析套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            user-select: none;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }
        canvas {
            display: block;
            margin: 0 auto;
            touch-action: none; /* 防止觸控畫線時畫面捲動 */
        }
        .pulse-btn {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        
        /* 全螢幕模式的排版覆寫 */
        body.fullscreen-mode header {
            display: none !important;
        }
        body.fullscreen-mode main {
            max-width: 100% !important;
            padding: 0.5rem !important;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        body.fullscreen-mode #sidebarPanel {
            display: none !important;
        }
        body.fullscreen-mode section.lg\:col-span-8 {
            grid-column: span 12 / span 12 !important;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        body.fullscreen-mode .canvas-container-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        body.fullscreen-mode #canvasScrollContainer {
            flex: 1;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-route text-2xl text-amber-300"></i>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">互動式鬼腳圖遊戲</h1>
                <span id="currentGroupBadge" class="bg-indigo-800 text-indigo-100 text-xs px-2.5 py-1 rounded-full font-medium border border-indigo-500">
                    內建群組 (20人)
                </span>
            </div>
            
            <div class="flex items-center flex-wrap gap-2">
                <button id="btnRestoreDefault" class="bg-amber-500 hover:bg-amber-600 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition shadow-sm flex items-center gap-1.5" title="還原為內建的 20 人配置">
                    <i class="fa-solid fa-rotate-left"></i> 還原預設配置
                </button>
                <button id="btnExportImport" class="bg-indigo-500 hover:bg-indigo-400 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-export"></i> 備份/載入設定
                </button>
                <button id="btnToggleSidebar" class="lg:hidden bg-indigo-700 hover:bg-indigo-800 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-sliders"></i> 設定面板
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-2 sm:px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- 左側設定面板 (可收合) -->
        <aside id="sidebarPanel" class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-300">
            <!-- 頁籤導覽 -->
            <div class="grid grid-cols-3 bg-slate-100 p-1 border-b border-slate-200 text-sm font-bold text-slate-600">
                <button data-tab="tab-group" class="tab-btn active py-2 rounded-xl bg-white text-indigo-600 shadow-sm transition">
                    <i class="fa-solid fa-users mr-1"></i>名單與組別
                </button>
                <button data-tab="tab-prizes" class="tab-btn py-2 rounded-xl hover:text-slate-900 transition">
                    <i class="fa-solid fa-gift mr-1"></i>號碼/品項
                </button>
                <button data-tab="tab-rules" class="tab-btn py-2 rounded-xl hover:text-slate-900 transition">
                    <i class="fa-solid fa-bars-staggered mr-1"></i>橫線與顯示
                </button>
            </div>

            <!-- 頁籤 1：名單與組別 -->
            <div id="tab-group" class="tab-content p-4 space-y-4">
                <!-- 組別選擇與管理 -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2.5">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">目前選擇組別</label>
                        <div class="flex gap-1">
                            <button id="btnNewGroup" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2 py-1 rounded font-medium transition">
                                <i class="fa-solid fa-plus"></i> 新增組別
                            </button>
                            <button id="btnEditGroup" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-600 px-2 py-1 rounded font-medium transition" title="編輯目前組別名稱與名單">
                                <i class="fa-solid fa-pen"></i> 編輯
                            </button>
                            <button id="btnDeleteGroup" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1 rounded font-medium transition" title="刪除目前組別">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <select id="groupSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
                </div>

                <!-- 學生名單編輯 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold text-slate-700">參與同學名單 (<span id="participantCount">20</span>人)</span>
                        <div class="space-x-1 flex flex-wrap justify-end gap-y-1">
                            <button id="btnPokerNames" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-800 px-2 py-1 rounded-md font-medium transition" title="依目前人數替換為撲克牌名單">
                                <i class="fa-solid fa-heart mr-1"></i>匯入撲克牌
                            </button>
                            <button id="btnImportNames" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2 py-1 rounded-md font-medium transition" title="批次匯入多筆名單">
                                <i class="fa-solid fa-file-import mr-1"></i>批次匯入
                            </button>
                            <button id="btnShuffleNames" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded-md font-medium transition" title="隨機打亂姓名順序">
                                <i class="fa-solid fa-shuffle mr-1"></i>隨機排序
                            </button>
                        </div>
                    </div>

                    <!-- 新增學生輸入框 -->
                    <div class="flex gap-2">
                        <input type="text" id="inputNewName" placeholder="輸入新增同學姓名..." class="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button id="btnAddName" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
                            <i class="fa-solid fa-plus"></i> 新增
                        </button>
                    </div>

                    <!-- 名單列表 -->
                    <ul id="namesList" class="space-y-1.5 max-h-64 overflow-y-auto pr-1 pt-1"></ul>
                </div>
            </div>

            <!-- 頁籤 2：目的地號碼與品項 -->
            <div id="tab-prizes" class="tab-content hidden p-4 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700">底部目的地設定</span>
                    <div class="flex gap-1 flex-wrap justify-end">
                        <button id="btnPokerPrizes" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-medium transition">
                            撲克牌
                        </button>
                        <button id="btnAutoNumberPrizes" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-medium transition">
                            1~N 依序編號
                        </button>
                        <button id="btnShufflePrizes" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-medium transition">
                            <i class="fa-solid fa-shuffle mr-1"></i>打亂順序
                        </button>
                    </div>
                </div>
                <p class="text-xs text-slate-500">可自由輸入號碼、獎品或懲罰項目（數量會自動對齊上方人數）：</p>
                <ul id="prizesList" class="space-y-2 max-h-80 overflow-y-auto pr-1"></ul>
            </div>

            <!-- 頁籤 3：橫線與隱藏設定 -->
            <div id="tab-rules" class="tab-content hidden p-4 space-y-5">
                <!-- 橫線數量設定 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-bold text-slate-700">橫線 (綠線) 數量設定</label>
                        <span id="rungCountBadge" class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold">6 條</span>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <input type="range" id="sliderRungCount" min="1" max="35" value="6" class="flex-1 accent-indigo-600 cursor-pointer">
                        <input type="number" id="inputRungCount" min="0" max="60" value="6" class="w-16 border border-slate-300 rounded-lg px-2 py-1 text-center text-sm font-bold">
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button id="btnRandomRungs" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-3 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> 隨機產生橫線
                        </button>
                        <button id="btnClearRungs" class="bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 py-2 px-3 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-eraser"></i> 清空所有橫線
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 leading-relaxed">
                        <i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i>提示：切換到右側的「編輯橫線」模式，可以直接在任兩條紅線之間點擊新增或刪除綠線！
                    </p>
                </div>

                <!-- 遮蔽與隱藏設定 -->
                <div class="space-y-2.5">
                    <h4 class="text-sm font-bold text-slate-700">遮蔽與盲抽設定</h4>
                    
                    <label class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 cursor-pointer transition">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-user-secret text-indigo-500 w-5 text-center"></i>
                            <span class="text-sm font-medium text-slate-700">隱藏上方同學姓名</span>
                        </div>
                        <input type="checkbox" id="chkHideNames" class="w-4 h-4 accent-indigo-600 rounded cursor-pointer">
                    </label>

                    <label class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 cursor-pointer transition">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-gift text-rose-500 w-5 text-center"></i>
                            <span class="text-sm font-medium text-slate-700">隱藏底部號碼/品項</span>
                        </div>
                        <input type="checkbox" id="chkHidePrizes" class="w-4 h-4 accent-indigo-600 rounded cursor-pointer">
                    </label>

                    <label class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 cursor-pointer transition">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-eye-slash text-emerald-600 w-5 text-center"></i>
                            <span class="text-sm font-medium text-slate-700">隱藏中間橫線 (神秘盲抽)</span>
                        </div>
                        <input type="checkbox" id="chkHideRungs" class="w-4 h-4 accent-indigo-600 rounded cursor-pointer">
                    </label>
                </div>
            </div>
        </aside>

        <!-- 右側主畫布與互動區 -->
        <section class="lg:col-span-8 flex flex-col gap-4">
            
            <!-- 互動模式與操作控制列 -->
            <div class="bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                
                <!-- 三種互動模式切換 -->
                <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 w-full sm:w-auto justify-center">
                    <button data-mode="auto" class="mode-btn active flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-robot"></i> 電腦走線
                    </button>
                    <button data-mode="draw" class="mode-btn flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-pen-nib"></i> 手動連連看
                    </button>
                    <button data-mode="edit" class="mode-btn flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-Sliders"></i> 點擊增減橫線
                    </button>
                </div>

                <!-- 動作按鈕區 -->
                <div class="flex items-center flex-wrap gap-2 w-full sm:w-auto justify-end">
                    <button id="btnToggleFullscreen" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1.5" title="切換全螢幕觀看">
                        <i class="fa-solid fa-expand"></i> <span id="fullscreenText">全螢幕</span>
                    </button>
                    <button id="btnTraceAll" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm flex items-center justify-center gap-1.5 pulse-btn">
                        <i class="fa-solid fa-play"></i> 全部路線揭曉
                    </button>
                    <button id="btnInstantAll" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1" title="跳過動畫直接顯示完成圖">
                        <i class="fa-solid fa-bolt"></i> 直接完成圖
                    </button>
                    <button id="btnClearPaths" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1" title="清除已畫出的路線">
                        <i class="fa-solid fa-rotate-left"></i> 清除路線
                    </button>
                </div>
            </div>

            <!-- 操作提示橫幅 -->
            <div id="modeInstructionBar" class="bg-indigo-50 border border-indigo-200 text-indigo-900 px-4 py-2.5 rounded-xl text-xs sm:text-sm flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <i id="modeIcon" class="fa-solid fa-circle-info text-indigo-600 text-base"></i>
                    <span id="modeInstructionText" class="font-medium">
                        【電腦走線模式】點擊「姓名」可由上往下連線；點擊底部「號碼/品項」可由下往上反查是哪位同學喔！
                    </span>
                </div>
                <span id="drawingStatusBadge" class="hidden bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-0.5 rounded-full text-xs font-bold shrink-0">
                    繪製中...
                </span>
            </div>

            <!-- 鬼腳圖 Canvas 畫布區 (包含縮放控制) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 relative flex flex-col canvas-container-wrapper">
                <!-- 縮放控制項 -->
                <div class="absolute top-3 right-3 flex items-center gap-1 bg-white/90 p-1 rounded-lg shadow-md border border-slate-200 z-10 backdrop-blur-sm">
                    <button id="btnZoomOut" class="p-1.5 hover:bg-slate-200 rounded text-slate-700 transition" title="縮小"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <span id="zoomLevelText" class="px-2 py-1 text-xs font-bold text-slate-700 w-12 text-center">100%</span>
                    <button id="btnZoomIn" class="p-1.5 hover:bg-slate-200 rounded text-slate-700 transition" title="放大"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                </div>
                
                <!-- 捲動區 -->
                <div id="canvasScrollContainer" class="p-2 sm:p-4 overflow-x-auto overflow-y-hidden w-full">
                    <canvas id="amidakujiCanvas" height="560"></canvas>
                </div>
            </div>

            <!-- 最終結果總覽面板 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-check text-indigo-600"></i>
                        配對結果一覽表
                    </h3>
                    <button id="btnRevealAllMasks" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-lg font-medium transition">
                        <i class="fa-solid fa-eye mr-1"></i>全部解除隱藏
                    </button>
                </div>
                <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2.5">
                    <!-- 動態生成結果卡片 -->
                </div>
            </div>

        </section>
    </main>

    <!-- 自訂彈出對話框 (取代 alert / prompt) -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-5 space-y-4 animate-fade-in">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">標題</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modalBody" class="text-sm text-slate-600 space-y-3">
                <!-- 動態內容 -->
            </div>
            <div id="modalFooter" class="flex justify-end gap-2 pt-2">
                <button id="btnModalCancel" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium transition">取消</button>
                <button id="btnModalConfirm" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold transition">確定</button>
            </div>
        </div>
    </div>

    <!-- 底部提示 Toast -->
    <div id="toastMsg" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastText">已更新設定</span>
    </div>

    <script>
        /**
         * 預設 20 人的群組配置
         */
        function createInitialRungs(cols, count) {
            const rungs = [];
            for (let i = 0; i < count; i++) {
                rungs.push({
                    col: Math.floor(Math.random() * cols),
                    yRatio: Number((0.10 + Math.random() * 0.80).toFixed(3))
                });
            }
            return rungs.sort((a, b) => a.yRatio - b.yRatio);
        }

        const DEFAULT_GROUP_20 = {
            id: 'default-class-group',
            groupName: '內建群組 (20人)',
            names: Array.from({length: 20}, (_, i) => String(i + 1)),
            prizes: Array.from({length: 20}, (_, i) => String(i + 1)),
            rungs: createInitialRungs(19, 30) // 隨機產生 30 條橫線
        };

        // 每位學生的專屬路線色彩
        const PATH_COLORS = [
            '#2563eb', // 藍
            '#d97706', // 琥珀橘
            '#7c3aed', // 紫
            '#059669', // 翡翠綠
            '#db2777', // 桃紅
            '#0891b2', // 青藍
            '#4f46e5', // 靛藍
            '#ea580c', // 深橘
            '#65a30d', // 萊姆綠
            '#9333ea'  // 亮紫
        ];

        // 應用程式主狀態
        const state = {
            groups: [JSON.parse(JSON.stringify(DEFAULT_GROUP_20))],
            currentGroupIndex: 0,
            mode: 'auto', // 'auto' (電腦走線) | 'draw' (手動連連看) | 'edit' (點擊增減橫線)
            hideNames: false,
            hidePrizes: false,
            hideRungs: false,
            revealedNames: {},  // 紀錄單獨被翻開的姓名 index
            revealedPrizes: {}, // 紀錄單獨被翻開的獎品 index
            
            // 路線與動畫狀態
            completedPaths: {}, // { startColIndex: { points: [...], endCol: number, color: string } }
            activeAnimations: [], // 正在跑的電腦動畫
            selectedAutoCol: null, // 目前高亮強調的學生欄位
            
            // 手動連連看狀態
            manualDraw: {
                isDrawing: false,
                startCol: null,
                points: [],
                color: '#2563eb'
            },

            // 編輯模式下預覽滑鼠位置
            hoverRung: null // { col, yRatio, existingIndex }
        };

        let currentZoom = 1.0; // 畫布縮放比例

        // Canvas 幾何設定常數
        const LAYOUT = {
            topMargin: 75,
            bottomMargin: 75,
            sideMargin: 65,
            minColSpacing: 95,
            canvasHeight: 560,
            boxWidth: 80,
            boxHeight: 38
        };

        // DOM 元素參照
        const canvas = document.getElementById('amidakujiCanvas');
        const ctx = canvas.getContext('2d');

        // 初始化執行
        window.onload = function() {
            bindEvents();
            syncUIFromState();
            resizeAndDraw();
            window.addEventListener('resize', resizeAndDraw);
        };

        // 取得目前組別物件
        function getCurrentGroup() {
            return state.groups[state.currentGroupIndex];
        }

        // 顯示底部提示訊息
        let toastTimer = null;
        function showToast(text) {
            const toast = document.getElementById('toastMsg');
            document.getElementById('toastText').textContent = text;
            toast.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2400);
        }

        // 尋找指定的終點是由哪一個起點連過來的 (反向查找)
        function findStartColForEndCol(targetEndCol) {
            const group = getCurrentGroup();
            for (let i = 0; i < group.names.length; i++) {
                if (calculatePathForColumn(i).endCol === targetEndCol) {
                    return i;
                }
            }
            return 0;
        }

        // 計算指定起點欄位的標準正確路徑 (逢綠線必轉)
        function calculatePathForColumn(startCol) {
            const group = getCurrentGroup();
            const sortedRungs = [...group.rungs].sort((a, b) => a.yRatio - b.yRatio);
            
            let currentCol = startCol;
            let currentY = 0; // yRatio 0 ~ 1
            const pathRatios = [{ col: currentCol, yRatio: 0 }];

            for (const rung of sortedRungs) {
                if (rung.yRatio <= currentY) continue;
                if (rung.col === currentCol) {
                    // 遇到右側橫線 -> 先往下走到交點，再右轉
                    pathRatios.push({ col: currentCol, yRatio: rung.yRatio });
                    currentCol = currentCol + 1;
                    pathRatios.push({ col: currentCol, yRatio: rung.yRatio });
                    currentY = rung.yRatio;
                } else if (rung.col === currentCol - 1) {
                    // 遇到左側橫線 -> 先往下走到交點，再左轉
                    pathRatios.push({ col: currentCol, yRatio: rung.yRatio });
                    currentCol = currentCol - 1;
                    pathRatios.push({ col: currentCol, yRatio: rung.yRatio });
                    currentY = rung.yRatio;
                }
            }

            // 抵達底部終點
            pathRatios.push({ col: currentCol, yRatio: 1 });
            return {
                startCol,
                endCol: currentCol,
                pathRatios
            };
        }

        // 將相對比例座標轉換為 Canvas 實際像素座標
        function getCanvasGeometry() {
            const group = getCurrentGroup();
            const count = group.names.length;
            const containerEl = document.getElementById('canvasScrollContainer');
            // 計算時考慮縮放倍率，讓畫布能在邏輯上延展
            const containerWidth = (containerEl.clientWidth - 20) / currentZoom;
            const requiredWidth = Math.max(containerWidth, LAYOUT.sideMargin * 2 + (count - 1) * LAYOUT.minColSpacing);
            
            const usableWidth = requiredWidth - LAYOUT.sideMargin * 2;
            const colSpacing = count > 1 ? usableWidth / (count - 1) : 0;
            const lineTop = LAYOUT.topMargin;
            const lineBottom = LAYOUT.canvasHeight - LAYOUT.bottomMargin;
            const lineHeight = lineBottom - lineTop;

            const getColX = (colIndex) => count > 1 ? LAYOUT.sideMargin + colIndex * colSpacing : requiredWidth / 2;
            const getY = (yRatio) => lineTop + yRatio * lineHeight;
            const getYRatio = (yPixel) => Math.max(0.05, Math.min(0.95, (yPixel - lineTop) / lineHeight));

            return {
                width: requiredWidth,
                height: LAYOUT.canvasHeight,
                count,
                colSpacing,
                lineTop,
                lineBottom,
                lineHeight,
                getColX,
                getY,
                getYRatio
            };
        }

        // 調整 Canvas 尺寸並重繪
        function resizeAndDraw() {
            const geo = getCanvasGeometry();
            const dpr = window.devicePixelRatio || 1;
            
            // 應用縮放倍率到實際 Canvas 的長寬
            const zoomedWidth = geo.width * currentZoom;
            const zoomedHeight = geo.height * currentZoom;

            canvas.width = zoomedWidth * dpr;
            canvas.height = zoomedHeight * dpr;
            canvas.style.width = zoomedWidth + 'px';
            canvas.style.height = zoomedHeight + 'px';
            
            // 設定縮放變形矩陣
            ctx.setTransform(dpr * currentZoom, 0, 0, dpr * currentZoom, 0, 0);
            drawCanvas();
        }

        // 主繪圖函式
        function drawCanvas() {
            const geo = getCanvasGeometry();
            const group = getCurrentGroup();
            ctx.clearRect(0, 0, geo.width, geo.height);

            // 1. 繪製背景淡網格
            ctx.save();
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for (let y = geo.lineTop; y <= geo.lineBottom; y += 30) {
                ctx.beginPath();
                ctx.moveTo(20, y);
                ctx.lineTo(geo.width - 20, y);
                ctx.stroke();
            }
            ctx.restore();

            // 2. 繪製神秘盲抽遮罩或綠線 (橫線)
            if (state.hideRungs) {
                ctx.save();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.beginPath();
                ctx.roundRect(
                     LAYOUT.sideMargin - 30,
                    geo.lineTop + 15,
                    geo.width - (LAYOUT.sideMargin - 30) * 2,
                    geo.lineHeight - 30,
                    16
                );
                ctx.fill();

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 20px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.fillText('🔒 神秘盲抽模式 (橫線已隱藏)', geo.width / 2, geo.lineTop + geo.lineHeight / 2 - 5);
                ctx.font = '13px "Noto Sans TC"';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText('點擊上方姓名或「全部路線揭曉」直接看結果，或取消勾選隱藏橫線', geo.width / 2, geo.lineTop + geo.lineHeight / 2 + 22);
                ctx.restore();
            } else {
                // 繪製所有綠色橫線
                ctx.save();
                group.rungs.forEach((rung) => {
                    if (rung.col >= 0 && rung.col < geo.count - 1) {
                        const x1 = geo.getColX(rung.col);
                        const x2 = geo.getColX(rung.col + 1);
                        const y = geo.getY(rung.yRatio);

                        ctx.strokeStyle = '#16a34a'; // 鮮明綠線 (呼應照片)
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(x1, y);
                        ctx.lineTo(x2, y);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }

            // 3. 繪製直向主線 (紅線，呼應照片)
            ctx.save();
            for (let i = 0; i < geo.count; i++) {
                const x = geo.getColX(i);
                ctx.strokeStyle = '#ef4444'; // 鮮紅直線
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x, geo.lineTop);
                ctx.lineTo(x, geo.lineBottom);
                ctx.stroke();

                // 轉角與端點裝飾圓點
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(x, geo.lineTop, 4, 0, Math.PI * 2);
                ctx.arc(x, geo.lineBottom, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 4. 若在「編輯橫線」模式且滑鼠懸停，顯示預覽虛線或刪除提示
            if (state.mode === 'edit' && state.hoverRung && !state.hideRungs) {
                const { col, yRatio, existingIndex } = state.hoverRung;
                const x1 = geo.getColX(col);
                const x2 = geo.getColX(col + 1);
                const y = geo.getY(yRatio);

                ctx.save();
                if (existingIndex !== -1) {
                    // 提示點擊可刪除
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.stroke();

                    ctx.fillStyle = '#e11d48';
                    ctx.beginPath();
                    ctx.arc((x1 + x2) / 2, y, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✕', (x1 + x2) / 2, y);
                } else {
                    // 提示點擊可新增綠線
                    ctx.strokeStyle = 'rgba(22, 163, 74, 0.55)';
                    ctx.lineWidth = 5;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.stroke();

                    ctx.fillStyle = '#16a34a';
                    ctx.beginPath();
                    ctx.arc((x1 + x2) / 2, y, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('+', (x1 + x2) / 2, y);
                }
                ctx.restore();
            }

            // 5. 繪製已完成的路線 (電腦或手動完成)
            Object.values(state.completedPaths).forEach((pathObj) => {
                const isSelected = state.selectedAutoCol === pathObj.startCol;
                const isDimmed = state.selectedAutoCol !== null && !isSelected;

                ctx.save();
                ctx.strokeStyle = pathObj.color;
                ctx.lineWidth = isSelected ? 8 : 5;
                ctx.globalAlpha = isDimmed ? 0.22 : 0.95;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isSelected) {
                    ctx.shadowColor = pathObj.color;
                    ctx.shadowBlur = 10;
                }

                ctx.beginPath();
                if (pathObj.isManual && pathObj.rawPoints) {
                    // 手動繪製的自由曲線
                    pathObj.rawPoints.forEach((pt, idx) => {
                        if (idx === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    });
                } else if (pathObj.pathRatios) {
                    // 電腦標準幾何路線
                    pathObj.pathRatios.forEach((node, idx) => {
                        const px = geo.getColX(node.col);
                        const py = geo.getY(node.yRatio);
                        if (idx === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                }
                ctx.stroke();
                ctx.restore();
            });

            // 6. 繪製正在進行中的電腦走線動畫
            state.activeAnimations.forEach((anim) => {
                ctx.save();
                ctx.strokeStyle = anim.color;
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = anim.color;
                ctx.shadowBlur = 8;

                ctx.beginPath();
                for (let i = 0; i <= anim.currentSegment; i++) {
                    const pt = anim.pixelPoints[i];
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                // 畫到目前插值位置
                ctx.lineTo(anim.headX, anim.headY);
                ctx.stroke();

                // 繪製領頭光點
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = anim.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(anim.headX, anim.headY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // 7. 繪製正在手動連連看的軌跡
            if (state.manualDraw.isDrawing && state.manualDraw.points.length > 0) {
                ctx.save();
                ctx.strokeStyle = state.manualDraw.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                state.manualDraw.points.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();
                ctx.restore();
            }

            // 8. 繪製頂部「同學姓名」方塊與底部「目的地號碼/品項」方塊
            for (let i = 0; i < geo.count; i++) {
                const x = geo.getColX(i);
                const color = PATH_COLORS[i % PATH_COLORS.length];
                const isStartDone = Boolean(state.completedPaths[i]);
                const isSelected = state.selectedAutoCol === i;

                // --- 頂部姓名方塊 ---
                const nameY = geo.lineTop - 48;
                const isNameMasked = state.hideNames && !state.revealedNames[i];
                const displayName = isNameMasked ? `❓ 隱藏 ${i + 1}` : group.names[i];

                let unarrivedNameColor = isNameMasked ? '#64748b' : '#1e293b';
                if (!isNameMasked && !isSelected) {
                    if (displayName.includes('♥') || displayName.includes('♦')) {
                        unarrivedNameColor = '#dc2626'; // 紅色系花色
                    } else if (displayName.includes('♠') || displayName.includes('♣')) {
                        unarrivedNameColor = '#0f172a'; // 黑色系花色
                    }
                }

                ctx.save();
                ctx.fillStyle = isSelected ? color : (isStartDone ? '#f8fafc' : '#ffffff');
                ctx.strokeStyle = isSelected || isStartDone ? color : '#cbd5e1';
                ctx.lineWidth = isSelected || isStartDone ? 3 : 2;
                ctx.beginPath();
                ctx.roundRect(x - LAYOUT.boxWidth / 2, nameY, LAYOUT.boxWidth, LAYOUT.boxHeight, 10);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isSelected ? '#ffffff' : (isStartDone ? '#94a3b8' : unarrivedNameColor);
                ctx.font = 'bold 14px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText( fitText(ctx, displayName, LAYOUT.boxWidth - 10), x, nameY + LAYOUT.boxHeight / 2 );
                ctx.restore();

                // --- 底部號碼/品項方塊 ---
                const prizeY = geo.lineBottom + 12;
                const matchedStartCol = Object.values(state.completedPaths).find(p => p.endCol === i)?.startCol;
                const hasArrived = matchedStartCol !== undefined;
                const arrivalColor = hasArrived ? PATH_COLORS[matchedStartCol % PATH_COLORS.length] : '#94a3b8';
                const isPrizeMasked = state.hidePrizes && !state.revealedPrizes[i];
                const rawPrize = group.prizes[i] !== undefined ? group.prizes[i] : String(i + 1);
                const displayPrize = isPrizeMasked ? '🎁 點擊翻開' : rawPrize;

                let unarrivedTextColor = '#92400e';
                if (!isPrizeMasked) {
                    if (displayPrize.includes('♥') || displayPrize.includes('♦')) {
                        unarrivedTextColor = '#dc2626'; // 紅色系花色
                    } else if (displayPrize.includes('♠') || displayPrize.includes('♣')) {
                        unarrivedTextColor = '#0f172a'; // 黑色系花色
                    }
                }

                ctx.save();
                ctx.fillStyle = hasArrived ? arrivalColor : '#fffbeb';
                ctx.strokeStyle = hasArrived ? arrivalColor : '#fcd34d';
                ctx.lineWidth = hasArrived ? 3 : 2;
                ctx.beginPath();
                ctx.roundRect(x - LAYOUT.boxWidth / 2, prizeY, LAYOUT.boxWidth, LAYOUT.boxHeight, 10);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = hasArrived ? '#ffffff' : (isPrizeMasked ? '#b45309' : unarrivedTextColor);
                ctx.font = isPrizeMasked ? 'bold 12px "Noto Sans TC"' : 'bold 16px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText( fitText(ctx, displayPrize, LAYOUT.boxWidth - 10), x, prizeY + LAYOUT.boxHeight / 2 );
                ctx.restore();
            }
        }

        // 截斷過長文字以符合方塊寬度
        function fitText(context, text, maxWidth) {
            if (context.measureText(text).width <= maxWidth) return text;
            let shortened = text;
            while (shortened.length > 1 && context.measureText(shortened + '…').width > maxWidth) {
                shortened = shortened.slice(0, -1);
            }
            return shortened + '…';
        }

        // 啟動單一同學的電腦走線動畫 (支援雙向)
        function startAutoTraceAnimation(startCol, isReverse = false, onComplete = null) {
            const geo = getCanvasGeometry();
            const pathInfo = calculatePathForColumn(startCol);
            const color = PATH_COLORS[startCol % PATH_COLORS.length];

            // 若已經有該同學正在跑的動畫，先移除
            state.activeAnimations = state.activeAnimations.filter(a => a.startCol !== startCol);
            delete state.completedPaths[startCol];

            const pixelPoints = pathInfo.pathRatios.map(pt => ({
                x: geo.getColX(pt.col),
                y: geo.getY(pt.yRatio)
            }));

            // 若為反向查找，則將座標點陣列顛倒，動畫就會由下往上畫
            if (isReverse) {
                pixelPoints.reverse();
            }

            const animObj = {
                startCol,
                endCol: pathInfo.endCol,
                pathRatios: pathInfo.pathRatios,
                pixelPoints,
                color,
                currentSegment: 0,
                segmentProgress: 0,
                headX: pixelPoints[0].x,
                headY: pixelPoints[0].y,
                speedPxPerFrame: 9.5,
                onComplete
            };

            state.activeAnimations.push(animObj);
            updateAnimationStatusUI();
            requestAnimationFrame(stepAnimations);
        }

        // 動畫影格步進
        let isAnimationLoopRunning = false;
        function stepAnimations() {
            if (state.activeAnimations.length === 0) {
                isAnimationLoopRunning = false;
                updateAnimationStatusUI();
                drawCanvas();
                return;
            }
            isAnimationLoopRunning = true;

            const finishedList = [];

            state.activeAnimations.forEach((anim) => {
                const p1 = anim.pixelPoints[anim.currentSegment];
                const p2 = anim.pixelPoints[anim.currentSegment + 1];
                const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

                if (dist < 0.5) {
                    anim.currentSegment++;
                } else {
                    anim.segmentProgress += anim.speedPxPerFrame / dist;
                    if (anim.segmentProgress >= 1) {
                        anim.segmentProgress = 0;
                        anim.currentSegment++;
                    }
                }

                if (anim.currentSegment >= anim.pixelPoints.length - 1) {
                    const lastPt = anim.pixelPoints[anim.pixelPoints.length - 1];
                    anim.headX = lastPt.x;
                    anim.headY = lastPt.y;
                    finishedList.push(anim);
                } else {
                    const curP1 = anim.pixelPoints[anim.currentSegment];
                    const curP2 = anim.pixelPoints[anim.currentSegment + 1];
                    anim.headX = curP1.x + (curP2.x - curP1.x) * anim.segmentProgress;
                    anim.headY = curP1.y + (curP2.y - curP1.y) * anim.segmentProgress;
                }
            });

            // 處理已抵達終點的路線
            if (finishedList.length > 0) {
                finishedList.forEach((doneAnim) => {
                    state.completedPaths[doneAnim.startCol] = {
                        startCol: doneAnim.startCol,
                        endCol: doneAnim.endCol,
                        pathRatios: doneAnim.pathRatios,
                        color: doneAnim.color,
                        isManual: false
                    };
                    // 自動翻開對應的起點與終點遮罩
                    state.revealedNames[doneAnim.startCol] = true;
                    state.revealedPrizes[doneAnim.endCol] = true;
                    if (typeof doneAnim.onComplete === 'function') doneAnim.onComplete();
                });

                state.activeAnimations = state.activeAnimations.filter(a => !finishedList.includes(a));
                renderResultsSummary();
                updateAnimationStatusUI();
            }

            drawCanvas();

            if (state.activeAnimations.length > 0) {
                requestAnimationFrame(stepAnimations);
            } else {
                isAnimationLoopRunning = false;
            }
        }

        function updateAnimationStatusUI() {
            const badge = document.getElementById('drawingStatusBadge');
            if (state.activeAnimations.length > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // 同步左側與下方所有 UI 清單
        function syncUIFromState() {
            const group = getCurrentGroup();

            // 更新頂部徽章與下拉選單
            document.getElementById('currentGroupBadge').textContent = group.groupName;
            const groupSelect = document.getElementById('groupSelect');
            groupSelect.innerHTML = '';
            state.groups.forEach((g, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${g.groupName} (${g.names.length}人)`;
                if (idx === state.currentGroupIndex) opt.selected = true;
                groupSelect.appendChild(opt);
            });

            // 更新人數與橫線數量顯示
            document.getElementById('participantCount').textContent = group.names.length;
            document.getElementById('rungCountBadge').textContent = `${group.rungs.length} 條`;
            document.getElementById('sliderRungCount').value = group.rungs.length;
            document.getElementById('inputRungCount').value = group.rungs.length;

            // 更新遮蔽核取方塊
            document.getElementById('chkHideNames').checked = state.hideNames;
            document.getElementById('chkHidePrizes').checked = state.hidePrizes;
            document.getElementById('chkHideRungs').checked = state.hideRungs;

            renderNamesList();
            renderPrizesList();
            renderResultsSummary();
        }

        // 渲染左側同學姓名列表 (可上下移動順序、改名、刪除)
        function renderNamesList() {
            const group = getCurrentGroup();
            const listEl = document.getElementById('namesList');
            listEl.innerHTML = '';

            group.names.forEach((name, idx) => {
                const color = PATH_COLORS[idx % PATH_COLORS.length];
                const isRed = name.includes('♥') || name.includes('♦');
                const textColorClass = isRed ? 'text-rose-600 font-bold' : (name.includes('♠') || name.includes('♣') ? 'text-slate-900 font-bold' : 'text-slate-800');
                
                const li = document.createElement('li');
                li.className = 'flex items-center gap-1.5 bg-slate-50 p-1.5 rounded-lg border border-slate-200';
                li.innerHTML = `
                    <span class="w-5 h-5 rounded-full text-white text-xs font-bold flex items-center justify-center shrink-0" style="background-color: ${color}">
                        ${idx + 1}
                    </span>
                    <input type="text" data-index="${idx}" value="${state.hideNames ? '****' : name}" ${state.hideNames ? 'disabled' : ''} 
                        class="name-edit-input flex-1 bg-white border border-slate-200 rounded px-2 py-1 text-sm font-medium ${textColorClass} focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button data-action="up" data-index="${idx}" class="p-1 text-slate-400 hover:text-slate-700 disabled:opacity-30" ${idx === 0 ? 'disabled' : ''} title="上移">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                    <button data-action="down" data-index="${idx}" class="p-1 text-slate-400 hover:text-slate-700 disabled:opacity-30" ${idx === group.names.length - 1 ? 'disabled' : ''} title="下移">
                        <i class="fa-solid fa-arrow-down text-xs"></i>
                    </button>
                    <button data-action="delete" data-index="${idx}" class="p-1 text-rose-400 hover:text-rose-600 disabled:opacity-30" ${group.names.length <= 2 ? 'disabled' : ''} title="刪除">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                `;
                listEl.appendChild(li);
            });

            // 綁定姓名修改事件
            listEl.querySelectorAll('.name-edit-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const i = parseInt(e.target.dataset.index, 10);
                    group.names[i] = e.target.value.trim() || `同學${i + 1}`;
                    drawCanvas();
                    renderResultsSummary();
                });
            });

            // 綁定上移、下移、刪除按鈕
            listEl.querySelectorAll('button[data-action]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = e.currentTarget.dataset.action;
                    const idx = parseInt(e.currentTarget.dataset.index, 10);
                    clearDrawnPaths();

                    if (action === 'up' && idx > 0) {
                        [group.names[idx - 1], group.names[idx]] = [group.names[idx], group.names[idx - 1]];
                    } else if (action === 'down' && idx < group.names.length - 1) {
                        [group.names[idx + 1], group.names[idx]] = [group.names[idx], group.names[idx + 1]];
                    } else if (action === 'delete' && group.names.length > 2) {
                        group.names.splice(idx, 1);
                        group.prizes.splice(idx, 1);
                        // 清理超出範圍的橫線
                        group.rungs = group.rungs.filter(r => r.col < group.names.length - 1);
                    }
                    syncUIFromState();
                    resizeAndDraw();
                });
            });
        }

        // 渲染左側底部號碼/品項列表
        function renderPrizesList() {

                    <span class="text-xs font-bold text-amber-800 bg-amber-200 px-2 py-1 rounded">終點 ${idx + 1}</span>
                    <input type="text" data-index="${idx}" value="${state.hidePrizes ? '****' : prize}" ${state.hidePrizes ? 'disabled' : ''}
                        placeholder="輸入號碼或獎品..."

        // 渲染下方配對結果卡片
        function renderResultsSummary() {
            const group = getCurrentGroup();
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            group.names.forEach((name, idx) => {
                const color = PATH_COLORS[idx % PATH_COLORS.length];
                const completed = state.completedPaths[idx];
                const isSelected = state.selectedAutoCol === idx;

                const isNameHidden = state.hideNames && !state.revealedNames[idx];
                const shownName = isNameHidden ? `隱藏 ${idx + 1}` : name;

                let prizeText = '尚未揭曉';
                let badgeClass = 'bg-slate-100 text-slate-400 border-slate-200';

                if (completed) {
                    const endCol = completed.endCol;
                    const isPrizeHidden = state.hidePrizes && !state.revealedPrizes[endCol];
                    const rawPrize = group.prizes[endCol] !== undefined ? group.prizes[endCol] : String(endCol + 1);
                    prizeText = isPrizeHidden ? '🎁 隱藏' : rawPrize;
                    badgeClass = 'bg-amber-50 text-amber-800 border-amber-300 font-black';
                }

                const card = document.createElement('div');
                card.className = `p-2.5 rounded-xl border transition cursor-pointer flex flex-col justify-between gap-1.5 ${
                    isSelected ? 'ring-2 ring-indigo-500 bg-indigo-50/40 border-indigo-300' : 'bg-slate-50/70 hover:bg-slate-100 border-slate-200'
                }`;
                card.innerHTML = `
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${color}"></span>
                        <span class="text-xs font-bold text-slate-700 truncate">${shownName}</span>
                    </div>
                    <div class="flex items-center justify-between border px-2 py-1 rounded-lg text-sm ${badgeClass}">
                        <i class="fa-solid fa-arrow-right text-[10px] opacity-60"></i>
                        <span class="truncate">${prizeText}</span>
                    </div>
                `;

                // 點擊結果卡片可高亮該同學路線或直接啟動他的走線
                card.addEventListener('click', () => {
                    if (state.completedPaths[idx]) {
                        state.selectedAutoCol = state.selectedAutoCol === idx ? null : idx;
                        drawCanvas();
                        renderResultsSummary();
                    } else {
                        state.selectedAutoCol = idx;
                        startAutoTraceAnimation(idx);
                    }
                });

                grid.appendChild(card);
            });
        }

        // 清除所有已畫出的路線
        function clearDrawnPaths() {
            state.activeAnimations = [];
            state.completedPaths = {};
            state.selectedAutoCol = null;
            state.manualDraw.isDrawing = false;
            state.manualDraw.points = [];
            updateAnimationStatusUI();
            drawCanvas();
            renderResultsSummary();
        }

        // 隨機生成指定數量的橫線 (避免相鄰橫線在同一高度重疊造成歧義)
        function generateRandomRungs(targetCount) {
            const group = getCurrentGroup();
            const cols = group.names.length - 1;
            if (cols <= 0) return;

            clearDrawnPaths();
            const newRungs = [];
            const minGap = 0.045; // 最小高度間距避免水平重疊
            let attempts = 0;

            while (newRungs.length < targetCount && attempts < 600) {
                attempts++;
                const col = Math.floor(Math.random() * cols);
                const yRatio = Number((0.10 + Math.random() * 0.80).toFixed(3));

                // 檢查同欄或左右相鄰欄是否有高度太接近的橫線
                const conflict = newRungs.some(r => 
                    Math.abs(r.col - col) <= 1 && Math.abs(r.yRatio - yRatio) < minGap
                );

                if (!conflict) {
                    newRungs.push({ col, yRatio });
                }
            }

            newRungs.sort((a, b) => a.yRatio - b.yRatio);
            group.rungs = newRungs;
            syncUIFromState();
            drawCanvas();
        }

        // 取得滑鼠或觸控在 Canvas 上的座標
        function getCanvasPointerPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: (clientX - rect.left) / currentZoom,
                y: (clientY - rect.top) / currentZoom
            };
        }

        // 切換互動模式
        function setInteractionMode(newMode) {
            state.mode = newMode;
            state.hoverRung = null;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                if (btn.dataset.mode === newMode) {
                    btn.className = 'mode-btn active flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition flex items-center justify-center gap-1.5';
                } else {
                    btn.className = 'mode-btn flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5';
                }
            });

            const instructionText = document.getElementById('modeInstructionText');
            if (newMode === 'auto') {
                instructionText.textContent = '【電腦走線模式】點擊「姓名」可由上往下連線；點擊底部「號碼/品項」可由下往上反查是哪位同學喔！';
                canvas.style.cursor = 'pointer';
            } else if (newMode === 'draw') {
                instructionText.textContent = '【手動連連看模式】請從上方任一同學姓名方塊按住滑鼠（或手指拖曳）往下畫線，到底部號碼方塊放開即可完成配對！';
                canvas.style.cursor = 'crosshair';
            } else if (newMode === 'edit') {
                instructionText.textContent = '【點擊增減橫線模式】將滑鼠移到任兩條紅線中間點擊即可「新增綠線」，點擊現有的綠線即可將其「刪除」。';
                canvas.style.cursor = 'cell';
            }
            drawCanvas();
        }

        // 自訂彈窗工具函式
        function openCustomModal({ title, htmlContent, showCancel = true, confirmText = '確定', onConfirm, onClose }) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = htmlContent;
            document.getElementById('btnModalCancel').style.display = showCancel ? 'inline-block' : 'none';
            document.getElementById('btnModalConfirm').textContent = confirmText;

            modal.classList.remove('hidden');

            const close = () => {
                if (typeof onClose === 'function') onClose();
                modal.classList.add('hidden');
            };
            document.getElementById('btnCloseModal').onclick = close;
            document.getElementById('btnModalCancel').onclick = close;
            document.getElementById('btnModalConfirm').onclick = () => {
                if (onConfirm) {
                    const shouldClose = onConfirm();
                    if (shouldClose !== false) close();
                } else {
                    close();
                }
            };
        }

        // 全域相機串流控制變數
        let activeCameraStream = null;
        let currentFacingMode = 'environment'; // 預設使用後置鏡頭

        function stopActiveCamera() {
            if (activeCameraStream) {
                activeCameraStream.getTracks().forEach(track => track.stop());
                activeCameraStream = null;
            }
            const camContainer = document.getElementById('liveCameraContainer');
            if (camContainer) camContainer.classList.add('hidden');
        }

        async function startLiveCamera(facingMode = 'environment') {
            stopActiveCamera();
            currentFacingMode = facingMode;
            const camContainer = document.getElementById('liveCameraContainer');
            const videoEl = document.getElementById('liveCameraVideo');
            const camErrorMsg = document.getElementById('cameraFallbackHint');

            if (!camContainer || !videoEl) return;

            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                activeCameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = activeCameraStream;
                await videoEl.play();
                camContainer.classList.remove('hidden');
                if (camErrorMsg) camErrorMsg.classList.add('hidden');
            } catch (err) {
                // 若瀏覽器不支援 WebRTC 或未授權相機，則自動觸發原生拍照 input
                if (camErrorMsg) camErrorMsg.classList.remove('hidden');
                const nativeCamInput = document.getElementById('fileCameraCapture');
                if (nativeCamInput) nativeCamInput.click();
            }
        }

                            <!-- 匯入方式選項 -->
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="importMode" value="replace" class="accent-indigo-600" checked>
                                    <span class="text-xs font-bold text-rose-600">取代現有名單 (建立新局)</span>

                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="importMode" value="append" class="accent-indigo-600">
                                    <span class="text-xs font-medium text-slate-700">加到現有名單後方</span>
                                </label>
                            </div>
                        </div>
                    `,
                    confirmText: '確認匯入名單',
                    onConfirm: () => {
                        stopActiveCamera();
                        const rawText = document.getElementById('modalImportNames').value;
                        const newNames = rawText.split(/[\s,，、\n]+/).map(s => s.trim()).filter(Boolean);
                        if (newNames.length === 0) {
                            showToast('請先拍照辨識或輸入名單喔！');
                            return false;
                        }
                        
                        const group = getCurrentGroup();
                        const mode = document.querySelector('input[name="importMode"]:checked').value;
                        
                        clearDrawnPaths();
                        
                        if (mode === 'replace') {
                            if (newNames.length < 2) {
                                showToast('完全取代時，至少需要 2 位同學！');
                                return false;
                            }
                            group.names = newNames;
                            group.prizes = newNames.map((_, i) => String(i + 1));
                            group.rungs = [];
                            generateRandomRungs(Math.min(12, newNames.length * 2));

                            newNames.forEach(n => {
                                group.names.push(n);
                                group.prizes.push(String(group.names.length));
                            });

                        syncUIFromState();
                        resizeAndDraw();
                        showToast(`成功匯入 ${newNames.length} 位同學名單！`);
                    }
                });

                // 預設自動開啟即時相機，並綁定拍照、切換鏡頭與檔案上傳事件
                setTimeout(() => {
                    const fileAll = document.getElementById('fileUploadAll');
                    const fileCam = document.getElementById('fileCameraCapture');
                    const btnSample = document.getElementById('btnFillSamplePhoto');
                    const btnOpenLiveCam = document.getElementById('btnOpenLiveCam');
                    const btnCloseLiveCam = document.getElementById('btnCloseLiveCam');
                    const btnSwitchCam = document.getElementById('btnSwitchCam');
                    const btnSnapPhoto = document.getElementById('btnSnapPhoto');

                    // 打開彈窗時預設直接啟動相機！
                    startLiveCamera('environment');

                    if (btnOpenLiveCam) {
                        btnOpenLiveCam.onclick = () => startLiveCamera(currentFacingMode);
                    }
                    if (btnCloseLiveCam) {
                        btnCloseLiveCam.onclick = () => stopActiveCamera();
                    }
                    if (btnSwitchCam) {
                        btnSwitchCam.onclick = () => {
                            const nextMode = currentFacingMode === 'environment' ? 'user' : 'environment';
                            startLiveCamera(nextMode);

                    if (btnSnapPhoto) {
