                            const videoEl = document.getElementById('liveCameraVideo');
                            if (!videoEl || !videoEl.videoWidth) return;

                            const snapCanvas = document.createElement('canvas');
                            snapCanvas.width = videoEl.videoWidth;
                            snapCanvas.height = videoEl.videoHeight;
                            const snapCtx = snapCanvas.getContext('2d');
                            snapCtx.drawImage(videoEl, 0, 0, snapCanvas.width, snapCanvas.height);

                            // 停止相機釋放資源並開始辨識
                            stopActiveCamera();

                            snapCanvas.toBlob(async (blob) => {
                                if (!blob) return;
                                const capturedFile = new File([blob], 'camera-capture.jpg', { type: 'image/jpeg' });
                                await processUploadedFileForNames(capturedFile);
                            }, 'image/jpeg', 0.95);
                        };
                    }

                    if (btnSample) {
                        btnSample.onclick = () => {
                            const area = document.getElementById('modalImportNames');
                            area.value = '李政憲\n李岱融\n李芸臻';
                            showToast('已帶入黃紙照片中的 3 位姓名！');
                        };
                    }

                    const btnFillScreenshot = document.getElementById('btnFillScreenshot');
                    if (btnFillScreenshot) {
                        btnFillScreenshot.onclick = () => {
                            const area = document.getElementById('modalImportNames');
                            area.value = '振熙\n明霈\n祺媛\n徐諦\n詣翔\n紫飛\n祈翰';
                            showToast('已帶入截圖中的 7 位姓名！');
                        };
                    }

                    const onFileSelected = async (e) => {
                        const file = e.target.files && e.target.files[0];
                        if (!file) return;
                        stopActiveCamera();
                        await processUploadedFileForNames(file);
                        e.target.value = '';
                    };

                    if (fileAll) fileAll.addEventListener('change', onFileSelected);
                    if (fileCam) fileCam.addEventListener('change', onFileSelected);
                }, 80);
            });

            // 新增單一學生
            const handleAddStudent = () => {
                const input = document.getElementById('inputNewName');
                const name = input.value.trim();
                if (!name) return;
                const group = getCurrentGroup();
                clearDrawnPaths();
                group.names.push(name);
                group.prizes.push(String(group.names.length));
                input.value = '';
                syncUIFromState();
                resizeAndDraw();
                showToast(`已新增「${name}」`);
            };
            document.getElementById('btnAddName').addEventListener('click', handleAddStudent);
            document.getElementById('inputNewName').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleAddStudent();
            });

            // 隨機打亂姓名順序
            document.getElementById('btnShuffleNames').addEventListener('click', () => {
                const group = getCurrentGroup();
                clearDrawnPaths();
                for (let i = group.names.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [group.names[i], group.names[j]] = [group.names[j], group.names[i]];
                }
                syncUIFromState();
                drawCanvas();
                showToast('已隨機打亂同學順序');
            });

            // 名單填入撲克牌 (依目前人數)
            document.getElementById('btnPokerNames').addEventListener('click', () => {
                const group = getCurrentGroup();
                const suits = ['♠', '♥', '♦', '♣'];
                const values = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];
                const pokerDeck = [];
                for (const suit of suits) {
                    for (const val of values) {
                        pokerDeck.push(`${suit}${val}`);
                    }
                }

                clearDrawnPaths();
                // 僅依據目前的人數替換姓名，保留原本的總人數與鬼腳圖橫線
                group.names = group.names.map((_, i) => pokerDeck[i % 52]);
                
                syncUIFromState();
                resizeAndDraw();
                showToast(`已為目前的 ${group.names.length} 人替換為撲克牌名單！`);
            });

            // 目的地填入撲克牌
            document.getElementById('btnPokerPrizes').addEventListener('click', () => {
                const group = getCurrentGroup();
                const suits = ['♠', '♥', '♦', '♣'];
                const values = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];
                const pokerDeck = [];
                for (const suit of suits) {
                    for (const val of values) {
                        pokerDeck.push(`${suit}${val}`);
                    }
                }
                group.prizes = group.names.map((_, i) => pokerDeck[i % 52]);
                syncUIFromState();
                drawCanvas();
                showToast('已依序填入撲克牌！');
            });

            // 目的地 1~N 依序編號
            document.getElementById('btnAutoNumberPrizes').addEventListener('click', () => {
                const group = getCurrentGroup();
                group.prizes = group.names.map((_, i) => String(i + 1));
                syncUIFromState();
                drawCanvas();
                showToast('已重設為 1 ~ N 順序編號');
            });

            // 隨機打亂底部號碼/品項
            document.getElementById('btnShufflePrizes').addEventListener('click', () => {
                const group = getCurrentGroup();
                for (let i = group.prizes.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [group.prizes[i], group.prizes[j]] = [group.prizes[j], group.prizes[i]];
                }
                syncUIFromState();
                drawCanvas();
                showToast('已打亂底部號碼/品項順序');
            });

            // --- 縮放與全螢幕控制 ---
            const updateZoomUI = () => {
                document.getElementById('zoomLevelText').textContent = `${Math.round(currentZoom * 100)}%`;
                resizeAndDraw();
            };

            document.getElementById('btnZoomIn').addEventListener('click', () => {
                currentZoom = Math.min(2.5, currentZoom + 0.1);
                updateZoomUI();
            });

            document.getElementById('btnZoomOut').addEventListener('click', () => {
                currentZoom = Math.max(0.3, currentZoom - 0.1);
                updateZoomUI();
            });

            const btnToggleFullscreen = document.getElementById('btnToggleFullscreen');
            const fullscreenText = document.getElementById('fullscreenText');
            
            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {
                        showToast('您的瀏覽器不支援全螢幕功能');
                    });
                } else {
                    document.exitFullscreen();
                }
            };

            btnToggleFullscreen.addEventListener('click', toggleFullscreen);

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    document.body.classList.add('fullscreen-mode');
                    fullscreenText.textContent = '退出全螢幕';
                    btnToggleFullscreen.querySelector('i').className = 'fa-solid fa-compress';
                } else {
                    document.body.classList.remove('fullscreen-mode');
                    fullscreenText.textContent = '全螢幕';
                    btnToggleFullscreen.querySelector('i').className = 'fa-solid fa-expand';
                }
                setTimeout(resizeAndDraw, 150); // 等待排版適應後重繪
            });

            // 橫線數量滑桿與輸入框連動
            const sliderRung = document.getElementById('sliderRungCount');
            const inputRung = document.getElementById('inputRungCount');
            sliderRung.addEventListener('input', (e) => {
                inputRung.value = e.target.value;
                generateRandomRungs(parseInt(e.target.value, 10));
            });
            inputRung.addEventListener('change', (e) => {
                const val = Math.max(0, Math.min(60, parseInt(e.target.value, 10) || 0));
                e.target.value = val;
                sliderRung.value = Math.min(35, val);
                generateRandomRungs(val);
            });

            // 隨機產生橫線按鈕
            document.getElementById('btnRandomRungs').addEventListener('click', () => {
                const count = parseInt(inputRung.value, 10) || 6;
                generateRandomRungs(count);
                showToast(`已隨機產生 ${getCurrentGroup().rungs.length} 條綠線`);
            });

            // 清空所有橫線按鈕
            document.getElementById('btnClearRungs').addEventListener('click', () => {
                clearDrawnPaths();
                getCurrentGroup().rungs = [];
                syncUIFromState();
                drawCanvas();
                showToast('已清空所有綠色橫線');
            });

            // 遮蔽設定開關
            document.getElementById('chkHideNames').addEventListener('change', (e) => {
                state.hideNames = e.target.checked;
                state.revealedNames = {};
                syncUIFromState();
                drawCanvas();
            });
            document.getElementById('chkHidePrizes').addEventListener('change', (e) => {
                state.hidePrizes = e.target.checked;
                state.revealedPrizes = {};
                syncUIFromState();
                drawCanvas();
            });
            document.getElementById('chkHideRungs').addEventListener('change', (e) => {
                state.hideRungs = e.target.checked;
                drawCanvas();
            });

            // 全部解除隱藏按鈕
            document.getElementById('btnRevealAllMasks').addEventListener('click', () => {
                state.hideNames = false;
                state.hidePrizes = false;
                state.hideRungs = false;
                syncUIFromState();
                drawCanvas();
                showToast('已解除所有隱藏遮罩');
            });

            // 全部路線揭曉 (動畫)
            document.getElementById('btnTraceAll').addEventListener('click', () => {
                const group = getCurrentGroup();
                state.selectedAutoCol = null;
                for (let i = 0; i < group.names.length; i++) {
                    if (!state.completedPaths[i]) {
                        startAutoTraceAnimation(i);
                    }
                }
            });

            // 直接完成圖 (跳過動畫立即繪製全部路線)
            document.getElementById('btnInstantAll').addEventListener('click', () => {
                const group = getCurrentGroup();
                state.activeAnimations = [];
                state.selectedAutoCol = null;
                for (let i = 0; i < group.names.length; i++) {
                    if (!state.completedPaths[i]) {
                        const pathInfo = calculatePathForColumn(i);
                        state.completedPaths[i] = {
                            startCol: i,
                            endCol: pathInfo.endCol,
                            pathRatios: pathInfo.pathRatios,
                            color: PATH_COLORS[i % PATH_COLORS.length],
                            isManual: false
                        };
                        state.revealedNames[i] = true;
                        state.revealedPrizes[pathInfo.endCol] = true;
                    }
                }
                updateAnimationStatusUI();
                drawCanvas();
                renderResultsSummary();
                showToast('已顯示全體路線完成圖');
            });

            // 清除已畫路線
            document.getElementById('btnClearPaths').addEventListener('click', () => {
                clearDrawnPaths();
                showToast('已清除路線');
            });

            // 備份與載入設定 JSON (方便複製保存)
            document.getElementById('btnExportImport').addEventListener('click', () => {
                const jsonStr = JSON.stringify(state.groups, null, 2);
                openCustomModal({
                    title: '備份或載入分組設定',
                    htmlContent: `
                        <p class="text-xs text-slate-500">您可以複製下方設定碼保存於記事本中，或貼上先前備份的設定碼後點擊「載入設定」：</p>
                        <textarea id="modalJsonArea" rows="7" class="w-full font-mono text-xs border border-slate-300 rounded-lg p-2 bg-slate-50">${jsonStr}</textarea>
                        <button id="btnCopyJson" class="w-full py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold transition">
                            <i class="fa-regular fa-copy mr-1"></i>複製設定碼到剪貼簿
                        </button>
                    `,
                    confirmText: '載入此設定',
                    onConfirm: () => {
                        try {
                            const parsed = JSON.parse(document.getElementById('modalJsonArea').value);
                            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].names) {
                                state.groups = parsed;
                                state.currentGroupIndex = 0;
                                clearDrawnPaths();
                                syncUIFromState();
                                resizeAndDraw();
                                showToast('設定載入成功！');
                                return true;
                            }
                        } catch (err) {
                            showToast('格式錯誤，請確認設定碼是否完整');
                            return false;
                        }
                    }
                });

                setTimeout(() => {
                    const copyBtn = document.getElementById('btnCopyJson');
                    if (copyBtn) {
                        copyBtn.onclick = () => {
                            const area = document.getElementById('modalJsonArea');
                            area.select();
                            document.execCommand('copy');
                            showToast('已複製到剪貼簿！');
                        };
                    }
                }, 50);
            });

            // --- Canvas 互動事件 (滑鼠與觸控) ---
            const handlePointerDown = (evt) => {
                const pos = getCanvasPointerPos(evt);
                const geo = getCanvasGeometry();
                const group = getCurrentGroup();

                // 檢查是否點擊頂部「姓名方塊」
                const nameY = geo.lineTop - 48;
                if (pos.y >= nameY && pos.y <= nameY + LAYOUT.boxHeight) {
                    for (let i = 0; i < geo.count; i++) {
                        const colX = geo.getColX(i);
                        if (Math.abs(pos.x - colX) <= LAYOUT.boxWidth / 2) {
                            state.revealedNames[i] = true;
                            if (state.mode === 'draw') {
                                // 啟動手動連連看繪圖
                                state.manualDraw.isDrawing = true;
                                state.manualDraw.startCol = i;
                                state.manualDraw.color = PATH_COLORS[i % PATH_COLORS.length];
                                state.manualDraw.points = [{ x: colX, y: geo.lineTop }];
                                delete state.completedPaths[i];
                            } else {
                                // 啟動電腦自動走線動畫或高亮已有路線
                                if (state.completedPaths[i]) {
                                    state.selectedAutoCol = state.selectedAutoCol === i ? null : i;
                                } else {
                                    state.selectedAutoCol = i;
                                    startAutoTraceAnimation(i, false); // 由上往下
                                }
                            }
                            drawCanvas();
                            renderResultsSummary();
                            return;
                        }
                    }
                }

                // 檢查是否點擊底部「號碼/品項方塊」 (可反向追蹤或單獨翻開遮罩)
                const prizeY = geo.lineBottom + 12;
                if (pos.y >= prizeY && pos.y <= prizeY + LAYOUT.boxHeight) {
                    for (let i = 0; i < geo.count; i++) {
                        const colX = geo.getColX(i);
                        if (Math.abs(pos.x - colX) <= LAYOUT.boxWidth / 2) {
                            if (state.mode === 'auto') {
                                state.revealedPrizes[i] = true;
                                const sCol = findStartColForEndCol(i);
                                if (state.completedPaths[sCol]) {
                                    // 已經畫過，切換高亮顯示
                                    state.selectedAutoCol = state.selectedAutoCol === sCol ? null : sCol;
                                } else {
                                    // 尚未畫過，啟動反向動畫 (由下往上)
                                    state.selectedAutoCol = sCol;
                                    startAutoTraceAnimation(sCol, true);
                                }
                            } else {
                                // 非 auto 模式下，點擊僅做翻開或蓋上遮罩的切換
                                state.revealedPrizes[i] = !state.revealedPrizes[i];
                            }
                            drawCanvas();
                            renderResultsSummary();
                            return;
                        }
                    }
                }

                // 若在「點擊增減橫線」模式且點擊中間區域
                if (state.mode === 'edit' && !state.hideRungs && pos.y > geo.lineTop + 10 && pos.y < geo.lineBottom - 10) {
                    updateHoverRung(pos, geo);
                    if (state.hoverRung) {
                        clearDrawnPaths();
                        if (state.hoverRung.existingIndex !== -1) {
                            group.rungs.splice(state.hoverRung.existingIndex, 1);
                            showToast('已刪除一條橫線');
                        } else {
                            group.rungs.push({
                                col: state.hoverRung.col,
                                yRatio: Number(state.hoverRung.yRatio.toFixed(3))
                            });
                            group.rungs.sort((a, b) => a.yRatio - b.yRatio);
                            showToast('已新增一條橫線');
                        }
                        state.hoverRung = null;
                        syncUIFromState();
                        drawCanvas();
                    }
                }
            };

            const handlePointerMove = (evt) => {
                const pos = getCanvasPointerPos(evt);
                const geo = getCanvasGeometry();

                if (state.mode === 'draw' && state.manualDraw.isDrawing) {
                    evt.preventDefault();
                    state.manualDraw.points.push({ x: pos.x, y: pos.y });
                    drawCanvas();
                } else if (state.mode === 'edit') {
                    updateHoverRung(pos, geo);
                    drawCanvas();
                }
            };

            const handlePointerUp = (evt) => {
                if (state.mode === 'draw' && state.manualDraw.isDrawing) {
                    const geo = getCanvasGeometry();
                    const pts = state.manualDraw.points;
                    const lastPt = pts[pts.length - 1];

                    // 判斷終點落在哪一個底部欄位附近
                    let nearestEndCol = 0;
                    let minDist = Infinity;
                    for (let i = 0; i < geo.count; i++) {
                        const d = Math.abs(lastPt.x - geo.getColX(i));
                        if (d < minDist) {
                            minDist = d;
                            nearestEndCol = i;
                        }
                    }

                    if (lastPt.y >= geo.lineBottom - 35 && minDist <= geo.colSpacing * 0.65) {
                        pts.push({ x: geo.getColX(nearestEndCol), y: geo.lineBottom });
                        const sCol = state.manualDraw.startCol;
                        
                        // --- 檢核機制 ---
                        const correctPathInfo = calculatePathForColumn(sCol);
                        if (nearestEndCol !== correctPathInfo.endCol) {
                            openCustomModal({
                                title: '檢核結果',
                                htmlContent: `<div class="text-center py-2"><i class="fa-solid fa-circle-xmark text-4xl text-rose-500 mb-3"></i><p class="text-lg font-bold text-slate-700">連線不正確喔！</p><p class="text-sm text-slate-500 mt-2">請確保「逢綠線必轉」，再試一次看看！</p></div>`,
                                showCancel: false,
                                confirmText: '重新挑戰'
                            });
                            state.manualDraw.isDrawing = false;
                            state.manualDraw.points = [];
                            drawCanvas();
                            return;
                        }
                        
                        showToast('🎉 檢核通過！連線正確！');
                        
                        state.completedPaths[sCol] = {
                            startCol: sCol,
                            endCol: nearestEndCol,
                            rawPoints: [...pts],
                            color: state.manualDraw.color,
                            isManual: true
                        };
                        state.revealedNames[sCol] = true;
                        state.revealedPrizes[nearestEndCol] = true;
                    } else {
                        showToast('請將線條一路畫到底部的號碼方塊喔！');
                    }

                    state.manualDraw.isDrawing = false;
                    state.manualDraw.points = [];
                    drawCanvas();
                    renderResultsSummary();
                }
            };

            // 計算滑鼠在「編輯橫線」模式下對準哪兩條紅線之間
            function updateHoverRung(pos, geo) {
                const group = getCurrentGroup();
                if (pos.y <= geo.lineTop + 15 || pos.y >= geo.lineBottom - 15) {
                    state.hoverRung = null;
                    return;
                }
                for (let c = 0; c < geo.count - 1; c++) {
                    const x1 = geo.getColX(c);
                    const x2 = geo.getColX(c + 1);
                    if (pos.x >= x1 + 8 && pos.x <= x2 - 8) {
                        const yRatio = geo.getYRatio(pos.y);
                        // 檢查是否靠近現有的橫線
                        const existingIndex = group.rungs.findIndex(
                            r => r.col === c && Math.abs(geo.getY(r.yRatio) - pos.y) <= 14
                        );
                        state.hoverRung = {
                            col: c,
                            yRatio: existingIndex !== -1 ? group.rungs[existingIndex].yRatio : yRatio,
                            existingIndex
                        };
                        return;
                    }
                }
                state.hoverRung = null;
            }

            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);
            canvas.addEventListener('mouseleave', () => {
                state.hoverRung = null;
                drawCanvas();
            });

            canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
            canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
            canvas.addEventListener('touchend', handlePointerUp);
        }

        /**
         * 處理使用者上傳的圖片或文件 (手寫影像增強 + Gemini 視覺模型高精準度辨識)
         */
        async function processUploadedFileForNames(file) {
            const statusBox = document.getElementById('ocrStatusBox');
            const statusTitle = document.getElementById('ocrStatusTitle');
            const statusSub = document.getElementById('ocrStatusSub');
            const thumb = document.getElementById('ocrPreviewThumb');
            const textarea = document.getElementById('modalImportNames');

            if (!statusBox || !textarea) return;

            statusBox.classList.remove('hidden');
            thumb.classList.add('hidden');
            statusTitle.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>正在讀取「${file.name}」...</span>`;
            statusSub.textContent = '請稍候，正在解析檔案內容';

            const ext = (file.name.split('.').pop() || '').toLowerCase();

            try {
                // 1. 純文字與 CSV
                if (ext === 'txt' || ext === 'csv') {
                    const text = await file.text();
                    appendExtractedNames(textarea, text);
                    statusTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i><span class="text-emerald-700">文字檔讀取完成！</span>`;
                    statusSub.textContent = '可在下方直接檢視或微調名單';
                    return;
                }

                // 2. Excel (.xlsx / .xls)
                if (ext === 'xlsx' || ext === 'xls') {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    const extracted = rows.flat().map(cell => String(cell || '').trim()).filter(Boolean).join('\n');
                    appendExtractedNames(textarea, extracted);
                    statusTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i><span class="text-emerald-700">Excel 名單解析成功！</span>`;
                    statusSub.textContent = `共讀取 ${extracted.split('\n').filter(Boolean).length} 筆資料`;
                    return;
                }

                // 3. Word (.docx)
                if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    appendExtractedNames(textarea, result.value);
                    statusTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i><span class="text-emerald-700">Word 文件解析成功！</span>`;
                    statusSub.textContent = '可在下方確認名單內容';
                    return;
                }

                // 4. 圖片檔 (包含手機拍照、黃色色紙手寫字等) 或 PDF 檔
                const isImage = file.type.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'heic'].includes(ext);
                const isPdf = file.type === 'application/pdf' || ext === 'pdf';

                if (isImage || isPdf) {
                    let inlineDataParts = [];

                    if (isImage) {
                        statusTitle.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>正在進行高解析影像處理...</span>`;
                        statusSub.textContent = '自動校正透明背景與尺寸，準備進行辨識';

                        const processed = await preprocessHandwritingImage(file);
                        thumb.src = processed.originalDataUrl;
                        thumb.classList.remove('hidden');

                        // 僅傳送經過白底校正的高解析原圖，避免濾鏡破壞印刷字體
                        inlineDataParts.push({
                            inlineData: { mimeType: 'image/jpeg', data: processed.originalBase64 }
                        });
                    } else {
                        // PDF 直接轉 base64
                        const base64Pdf = await fileToBase64(file);
                        inlineDataParts.push({
                            inlineData: { mimeType: 'application/pdf', data: base64Pdf }
                        });
                    }

                    statusTitle.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>AI 正在精準辨識繁體中文姓名...</span>`;
                    statusSub.textContent = '支援直向手寫、橫排方塊與清單格式';

                    const recognizedNames = await callGeminiHandwritingOCR(inlineDataParts);
                    if (recognizedNames && recognizedNames.length > 0) {
                        // 預設清空或直接填入辨識結果，方便使用者立即檢視
                        textarea.value = recognizedNames.join('\n');
                        statusTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i><span class="text-emerald-700">辨識完成！共擷取到 ${recognizedNames.length} 位姓名</span>`;
                        statusSub.textContent = '請確認下方文字框內容，若有需要可直接點擊修改';
                    } else {
                        throw new Error('未能辨識出有效文字');
                    }
                    return;
                }

                showToast('不支援的檔案格式，請上傳圖片、PDF、Word 或 Excel');
            } catch (err) {
                statusTitle.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-600"></i><span class="text-rose-600">辨識未完成，請重拍或手動調整</span>`;
                statusSub.textContent = '小提示：請確保文字清晰且光線均勻';
            }
        }

        // 將辨識出的文字附加到輸入框中
        function appendExtractedNames(textarea, rawText) {
            const cleaned = rawText
                .split(/[\r\n,，、;；]+/)
                .map(s => s.replace(/^[0-9.\-、()（）\s]+/, '').trim())
                .filter(Boolean)
                .join('\n');

            if (!cleaned) return;
            const existing = textarea.value.trim();
            textarea.value = existing ? `${existing}\n${cleaned}` : cleaned;
        }

        // 檔案轉 Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const res = String(reader.result || '');
                    resolve(res.split(',')[1] || '');
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        /**
         * 改良版影像前處理：
         * 1. 提供高解析度 (最高 2048px) 原始彩色影像，確保不會因為過度二值化導致筆畫斷裂產生錯字。
         * 2. 提供柔和自動色階 (Auto-Levels) 增強影像，幫助辨識黃色色紙或陰影下的手寫字。
         */
        function preprocessHandwritingImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);

                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    const maxDim = 2048;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }

                    // 1. 高解析清晰原圖 (修復 PNG 透明背景變黑的問題)
                    const canvasOrig = document.createElement('canvas');
                    canvasOrig.width = w;
                    canvasOrig.height = h;
                    const ctxOrig = canvasOrig.getContext('2d');
                    
                    // 【關鍵修正】先鋪上純白底色，防止透明 PNG 圖片在轉 JPEG 時黑底黑字
                    ctxOrig.fillStyle = '#ffffff';
                    ctxOrig.fillRect(0, 0, w, h);
                    ctxOrig.drawImage(img, 0, 0, w, h);
                    
                    const originalDataUrl = canvasOrig.toDataURL('image/jpeg', 0.95);
                    const originalBase64 = originalDataUrl.split(',')[1];

                    resolve({
                        originalBase64,
                        originalDataUrl
                    });
                };

                img.onerror = (e) => {
                    URL.revokeObjectURL(objectUrl);
                    reject(e);
                };

                img.src = objectUrl;
            });
        }

        /**
         * 呼叫 Gemini 3 Flash Preview 進行結構化繁體中文姓名辨識
         * 設定 temperature: 0.1 降低隨機猜測，並使用 JSON Schema 確保穩定輸出姓名陣列
         */
        async function callGeminiHandwritingOCR(inlineDataParts) {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `你是一位頂尖的光學字元辨識（OCR）專家，專精於台灣繁體中文姓名。
請從使用者提供的圖片中，由上而下、由左而右依序辨識出所有的人名。

重要辨識原則：
1. 圖片可能是「清晰的電腦螢幕截圖（如橫向排列的方塊字卡）」，也可能是手寫字。
2. 若為印刷體/電腦字體，請【100% 絕對忠實】於圖片上的字元！絕不可因為覺得是罕見字或為了語意順暢而自行腦補替換（例如：寫「明霈」絕不能改成「明霞」，寫「徐諦」絕不能改成「徐啼」，寫「祺媛」不能亂改，寫「詣翔」絕不能改「誼翔」等）。
3. 請精確分辨形近字，例如：霈/震/霞、 諦/啼/蹄、 詣/誼/旨、 熙/照。
4. 切勿漏字，每個圓角方塊內的名字都要提取出來。若無人名請略過單純的數字編號。`;

            const userPrompt = "請仔細觀察圖片中的每一個字的部首與筆畫，依序提取出圖片裡的所有姓名，並以 JSON 格式回傳。";

            const payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: userPrompt },
                        ...inlineDataParts
                    ]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                generationConfig: {
                    temperature: 0.1,
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            names: {
                                type: "ARRAY",
                                items: { type: "STRING" }
                            }
                        },
                        required: ["names"]
                    }
                }
            };

            const delays = [1000, 2000, 4000];
            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('API Error');

                    const result = await response.json();
                    const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (rawJson) {
                        const parsed = JSON.parse(rawJson);
                        if (Array.isArray(parsed.names)) {
                            return parsed.names.map(s => String(s).trim()).filter(Boolean);
                        }
                    }
                } catch (err) {
                    if (attempt === delays.length) throw err;
                    await new Promise(r => setTimeout(r, delays[attempt]));
                }
            }
            return [];
        }
    </script>
